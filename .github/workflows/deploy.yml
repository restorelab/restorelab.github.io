name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# Pages deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is written on Windows, and npm
      # only records the optional dependency tree it resolved there. On Linux,
      # the wasm fallbacks of Tailwind and the markdown processor hoist
      # @emnapi/core and @emnapi/runtime to the root, where the lockfile has no
      # entry for them — and `npm ci` refuses to install rather than resolve
      # them. Tighten this back to `npm ci` if the lockfile is ever regenerated
      # on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # Après le build : il lui faut les routes réellement bâties pour vérifier
      # que les liens des pages françaises résolvent.
      - run: npm run check:i18n
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
