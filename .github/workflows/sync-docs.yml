# Pull the generated documentation from the RestoreLab repository.
#
# DORMANT: this workflow is manual-only (`workflow_dispatch`) for as long as
# github.com/restorelab/restorelab stays private. It cannot run unattended
# because the private source checkout needs a token the default GITHUB_TOKEN
# cannot provide.
#
# When the main repository goes public:
#   1. Add a `repository_dispatch` trigger here, e.g.
#        on:
#          repository_dispatch:
#            types: [docs-updated]
#      and, on the RestoreLab side, a workflow that fires it on every push to
#      master touching `docs/**` (a `peter-evans/repository-dispatch` step, or
#      a plain `gh api -X POST repos/restorelab/restorelab.github.io/dispatches
#      -f event_type=docs-updated`).
#   2. Store a fine-grained PAT as the `RESTORELAB_SRC_TOKEN` secret in this
#      repository: read-only Contents on restorelab/restorelab, nothing else.
#      The same PAT is what the RestoreLab side needs to fire the dispatch
#      (Contents: read-write on this repository), so mint two, not one.
#
# Note: a pull request opened with GITHUB_TOKEN does not trigger other
# workflows, so `deploy.yml` will not run on it. That is fine — the deployment
# happens when the pull request is merged into master.

name: Sync docs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

env:
  BRANCH: chore/sync-docs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v7

      - name: Check out RestoreLab
        uses: actions/checkout@v7
        with:
          repository: restorelab/restorelab
          path: .restorelab-src
          # Remove this line once restorelab/restorelab is public.
          token: ${{ secrets.RESTORELAB_SRC_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # sync-docs.mjs only uses Node built-ins, so no install is needed.
      - name: Run the sync
        run: RESTORELAB_REPO=.restorelab-src node scripts/sync-docs.mjs

      - name: Detect a diff
        id: diff
        # Scoped to the generated content: .restorelab-src is an untracked
        # checkout and must never end up in the pull request.
        run: |
          if [ -n "$(git status --porcelain -- src/content/docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- src/content/docs
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation change."
          fi

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- src/content/docs
          git commit -m "docs: sync from restorelab/restorelab"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "docs: sync from restorelab/restorelab" \
              --body "Generated by \`.github/workflows/sync-docs.yml\`. Do not edit these files here — edit them in restorelab/restorelab and re-run the sync."
          else
            echo "The existing pull request for $BRANCH was updated."
          fi
